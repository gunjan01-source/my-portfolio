<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | Loading</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Outfit:wght@300;400;500;700&display=swap"
        rel="stylesheet">
    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Mouse Glow -->
    <div class="cursor-glow"></div>
    <!-- Grain -->
    <div class="grain"></div>
    <!-- Particles -->
    <div class="particles"></div>
    <!-- Decorative Shapes -->
    <!-- Star -->
    <svg class="shape star star1" viewBox="0 0 100 100">
        <path d="M50 0
                 L58 42
                 L100 50
                 L58 58
                 L50 100
                 L42 58
                 L0 50
                 L42 42 Z" />
    </svg>
    <!-- Small Star -->
    <svg class="shape star star2" viewBox="0 0 100 100">
        <path d="M50 0
                 L58 42
                 L100 50
                 L58 58
                 L50 100
                 L42 58
                 L0 50
                 L42 42 Z" />
    </svg>
    <!-- Flower -->
    <svg class="shape flower flower1" viewBox="0 0 200 200">
        <g>
            <ellipse cx="100" cy="40" rx="22" ry="50" />
            <ellipse cx="100" cy="160" rx="22" ry="50" />
            <ellipse cx="40" cy="100" rx="22" ry="50" transform="rotate(90 40 100)" />
            <ellipse cx="160" cy="100" rx="22" ry="50" transform="rotate(90 160 100)" />
            <circle cx="100" cy="100" r="12" />
        </g>
    </svg>
    <!-- Oval -->
    <svg class="shape oval" viewBox="0 0 220 120">
        <ellipse cx="110" cy="60" rx="95" ry="40" />
    </svg>
    <!-- Arch -->
    <svg class="shape arch" viewBox="0 0 120 160">
        <path d="M20 160
               V70
               C20 25
               100 25
               100 70
               V160" />
    </svg>
    <!-- Circle -->
    <div class="shape circle"></div>
    <!-- Blob -->
    <div class="blob blob1"></div>
    <div class="blob blob2"></div>
    <div class="blob blob3"></div>
    <!-- Loading Container -->
    <main class="loading-screen">
        <div class="content">
            <p class="tag">
                Digital Portfolio • 2026
            </p>
            <h1 class="title">
                PORT
                <br>
                FOLIO
            </h1>
            <p class="subtitle">
                Building something beautiful...
            </p>
            <!-- Progress Bar -->
            <div class="progress">
                <div class="progress-fill"></div>
            </div>
            <p class="loading-text">
                Loading...
               <span id="percent">
                    0%
                </span>
            </p>
        </div>
    </main>
    <!-- Bottom Text -->
    <footer>
        <p>
            Designed & Developed with ♡
        </p>

    </footer>  
<!-- JS -->
    <script src="script.js"></script>
</body>
</html>
