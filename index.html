<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | Loading</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Outfit:wght@300;400;500;700&display=swap"
        rel="stylesheet">
    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Mouse Glow -->
    <div class="cursor-glow"></div>
    <!-- Grain -->
    <div class="grain"></div>
    <!-- Particles -->
    <div class="particles"></div>

    <!-- Decorative Shapes -->

    <!-- Sparkle (thin outline, 4-point) -->
    <svg class="shape sparkle sparkle1" viewBox="0 0 100 220">
        <path d="M50 0
                 C50 60, 55 90, 100 110
                 C55 130, 50 160, 50 220
                 C50 160, 45 130, 0 110
                 C45 90, 50 60, 50 0 Z" />
    </svg>

    <!-- Sparkle (solid, 4-point) -->
    <svg class="shape sparkle sparkle2 solid" viewBox="0 0 100 220">
        <path d="M50 0
                 C50 60, 55 90, 100 110
                 C55 130, 50 160, 50 220
                 C50 160, 45 130, 0 110
                 C45 90, 50 60, 50 0 Z" />
    </svg>

    <!-- Starburst (thin rays) -->
    <svg class="shape starburst" viewBox="0 0 200 200">
        <g stroke-width="1.5">
            <line x1="100" y1="10" x2="100" y2="190" />
            <line x1="10" y1="100" x2="190" y2="100" />
            <line x1="35" y1="35" x2="165" y2="165" />
            <line x1="165" y1="35" x2="35" y2="165" />
            <line x1="100" y1="30" x2="100" y2="170" transform="rotate(22.5 100 100)" />
            <line x1="100" y1="30" x2="100" y2="170" transform="rotate(45 100 100)" />
            <line x1="100" y1="30" x2="100" y2="170" transform="rotate(67.5 100 100)" />
            <line x1="100" y1="30" x2="100" y2="170" transform="rotate(112.5 100 100)" />
            <line x1="100" y1="30" x2="100" y2="170" transform="rotate(135 100 100)" />
            <line x1="100" y1="30" x2="100" y2="170" transform="rotate(157.5 100 100)" />
        </g>
    </svg>

    <!-- Spiky sun (solid) -->
    <svg class="shape spikysun spikysun2 solid" viewBox="0 0 200 200">
        <path d="M100,10 L110,45 L140,25 L135,60 L170,55
                 L150,80 L185,90 L150,100 L185,110
                 L150,120 L170,145 L135,140 L140,175
                 L110,155 L100,190 L90,155 L60,175
                 L65,140 L30,145 L50,120 L15,110
                 L50,100 L15,90 L50,80 L30,55
                 L65,60 L60,25 L90,45 Z" />
    </svg>

    <!-- Rounded flower (petals as ellipses, like reference) -->
    <svg class="shape petalflower solid" viewBox="0 0 200 200">
        <g>
            <ellipse cx="100" cy="55" rx="26" ry="45" />
            <ellipse cx="100" cy="145" rx="26" ry="45" />
            <ellipse cx="55" cy="100" rx="45" ry="26" />
            <ellipse cx="145" cy="100" rx="45" ry="26" />
            <ellipse cx="65" cy="65" rx="24" ry="40" transform="rotate(45 65 65)" />
            <ellipse cx="135" cy="65" rx="24" ry="40" transform="rotate(-45 135 65)" />
            <ellipse cx="65" cy="135" rx="24" ry="40" transform="rotate(-45 65 135)" />
            <ellipse cx="135" cy="135" rx="24" ry="40" transform="rotate(45 135 135)" />
        </g>
    </svg>

    <!-- Arch -->
    <svg class="shape arch" viewBox="0 0 120 160">
        <path d="M20 160
               V70
               C20 25
               100 25
               100 70
               V160" />
    </svg>

    <!-- Star -->
    <svg class="shape star star1" viewBox="0 0 100 100">
        <path d="M50 0
                 L58 42
                 L100 50
                 L58 58
                 L50 100
                 L42 58
                 L0 50
                 L42 42 Z" />
    </svg>
    <!-- Small Star -->
    <svg class="shape star star2" viewBox="0 0 100 100">
        <path d="M50 0
                 L58 42
                 L100 50
                 L58 58
                 L50 100
                 L42 58
                 L0 50
                 L42 42 Z" />
    </svg>
    <!-- Flower -->
    <svg class="shape flower flower1" viewBox="0 0 200 200">
        <g>
            <ellipse cx="100" cy="40" rx="22" ry="50" />
            <ellipse cx="100" cy="160" rx="22" ry="50" />
            <ellipse cx="40" cy="100" rx="22" ry="50" transform="rotate(90 40 100)" />
            <ellipse cx="160" cy="100" rx="22" ry="50" transform="rotate(90 160 100)" />
            <circle cx="100" cy="100" r="12" />
        </g>
    </svg>
    <!-- Oval -->
    <svg class="shape oval" viewBox="0 0 220 120">
        <ellipse cx="110" cy="60" rx="95" ry="40" />
    </svg>
    <!-- Circle -->
    <div class="shape circle"></div>
    <!-- Blob -->
    <div class="blob blob1"></div>
    <div class="blob blob2"></div>
    <div class="blob blob3"></div>

    <!-- Loading Container -->
    <main class="loading-screen">
        <div class="content">
            <p class="tag">
                Digital Portfolio • 2026
            </p>
            <h1 class="title">
                PORT
                <br>
                FOLIO
            </h1>
            <p class="subtitle">
                Building something beautiful...
            </p>
            <!-- Progress Bar -->
            <div class="progress">
                <div class="progress-fill"></div>
            </div>
            <p class="loading-text">
                Loading...
               <span id="percent">
                    0%
                </span>
            </p>
        </div>
    </main>
    <!-- Bottom Text -->
    <footer>
        <p>
            Designed & Developed with ♡
        </p>

    </footer>  
<!-- JS -->
    <script src="script.js"></script>
</body>
</html>
